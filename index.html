<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="罗辑个人主页 —— 软件工程方向个人博客与作品集，记录技术文章与软件项目。" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Ctext x='16' y='22' font-family='monospace' font-weight='bold' font-size='16' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E"
    />
    <title>罗辑个人主页 · LUOJI</title>
    <script>
      // 初始主题：浅色为主基调，跟随系统或本地记忆切换到深色，避免闪烁
      ;(function () {
        try {
          var saved = localStorage.getItem('luoji.theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* ignore */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
