name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 单元测试为纯 JUnit（不依赖外部 MySQL/Redis），因此无需起服务即可跑通
      - name: Build & Test
        working-directory: backend
        run: mvn -B verify
