# =============================================================================
# 后端全栈编排：MySQL + Redis + Spring Boot 应用
#
# 一键启动：docker compose up -d --build
# 应用通过容器网络内的服务名（mysql / redis）访问依赖，端口仅对宿主暴露所需项。
# =============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: luoji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-luoji_blog}
      MYSQL_USER: ${DB_USER:-luoji}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luoji123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: luoji-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: luoji-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-luoji_blog}
      DB_USER: ${DB_USER:-luoji}
      DB_PASSWORD: ${DB_PASSWORD:-luoji123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production-0123456789abcdef0123456789}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
