# =============================================================================
# 后端依赖中间件：MySQL + Redis
#
# 注意：宿主端口映射——
#   MySQL 默认映射到 3307（避免与本机已装的 MySQL 3306 冲突）
#   Redis 默认映射到 6379
# 可通过 .env 覆盖（见 .env.example）。
# =============================================================================
services:
  mysql:
    image: mysql:8.4
    container_name: luoji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-luoji_blog}
      MYSQL_USER: ${DB_USER:-luoji}
      MYSQL_PASSWORD: ${DB_PASSWORD:-luoji123456}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3307}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: luoji-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
