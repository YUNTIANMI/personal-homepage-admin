# =============================================================================
# 开发环境
# 数据库连接信息通过环境变量注入（见 backend/.env.example），默认值用于本地开发
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:luoji_blog}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:luoji}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: luoji-hikari

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3s
      connect-timeout: 3s

  flyway:
    # 启动时自动执行 db/migration 下的迁移脚本，建表不再依赖手工执行 SQL
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

mybatis-plus:
  configuration:
    # 开发环境打印 SQL，便于调试
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.luoji.blog: debug
