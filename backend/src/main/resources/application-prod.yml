# =============================================================================
# 生产环境
# 所有敏感项必须由环境变量提供（无默认值，启动即校验），避免误用开发配置上线
# =============================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      pool-name: luoji-hikari

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产环境不做自动 baseline，避免误接管已有库
    baseline-on-migrate: false
    validate-on-migrate: true

mybatis-plus:
  configuration:
    # 生产环境不打印 SQL
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: info
    com.luoji.blog: info
